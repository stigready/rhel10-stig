# StigForge-owned gap-fill: `enable_authselect` (CCE-89732-2).
#
# Upstream status (ComplianceAsCode/content, checked against v0.1.82): the
# RHEL10 STIG profile (rhel10-playbook-stig.yml) does not ship the
# `enable_authselect` rule that RHEL8/RHEL9 STIG profiles include. Several
# downstream PAM rules in the same playbook (e.g. "Ensure PAM Displays Last
# Logon/Access Notification") run an `authselect check` integrity assertion and
# *abort the whole play* on a minimal image with no authselect profile
# selected - this was silently skipping ~180 downstream tasks in verify runs
# and holding the score at 88.6%. This is a real prerequisite fix, not a
# scoring exemption: it performs the same profile-selection remediation
# ComplianceAsCode already ships for RHEL8/RHEL9, ported here so RHEL10 STIG
# apply doesn't abort early.
# Track upstream: file/confirm a ComplianceAsCode issue requesting
# `enable_authselect` be added to the RHEL10 STIG profile, then drop this file.
#
# Source: ComplianceAsCode/content (scap-security-guide) - BSD-3-Clause.
---
- name: Enable authselect - Check Current authselect Profile
  ansible.builtin.command:
    cmd: authselect current
  register: result_authselect_current
  changed_when: false
  failed_when: false
  tags:
  - CCE-89732-2
  - DISA-STIG-needed_rules
  - NIST-800-53-AC-3
  - PCI-DSSv4-8.3
  - PCI-DSSv4-8.3.4
  - configure_strategy
  - enable_authselect
  - low_complexity
  - medium_disruption
  - medium_severity
  - no_reboot_needed
  - stigforge_gapfill
- name: Enable authselect - Try to Select an authselect Profile
  ansible.builtin.command:
    cmd: authselect select "{{ var_authselect_profile | default('sssd') }}"
  register: result_authselect_select
  changed_when: result_authselect_select.rc == 0
  failed_when: false
  when: result_authselect_current.rc != 0
  tags:
  - CCE-89732-2
  - DISA-STIG-needed_rules
  - NIST-800-53-AC-3
  - PCI-DSSv4-8.3
  - PCI-DSSv4-8.3.4
  - configure_strategy
  - enable_authselect
  - low_complexity
  - medium_disruption
  - medium_severity
  - no_reboot_needed
  - stigforge_gapfill
- name: Enable authselect - Verify If pam Has Been Altered
  ansible.builtin.command:
    cmd: rpm -qV pam
  register: result_altered_authselect
  changed_when: false
  failed_when: false
  when:
  - result_authselect_select is not skipped
  - result_authselect_select.rc != 0
  tags:
  - CCE-89732-2
  - DISA-STIG-needed_rules
  - NIST-800-53-AC-3
  - PCI-DSSv4-8.3
  - PCI-DSSv4-8.3.4
  - configure_strategy
  - enable_authselect
  - low_complexity
  - medium_disruption
  - medium_severity
  - no_reboot_needed
  - stigforge_gapfill
- name: Enable authselect - Informative Message Based on authselect Integrity Check
  ansible.builtin.assert:
    that:
    - result_authselect_current.rc == 0 or result_altered_authselect is skipped or result_altered_authselect.rc == 0
    fail_msg:
    - authselect is not used but files from the 'pam' package have been altered, so the authselect configuration won't be
      forced.
    quiet: true
  tags:
  - CCE-89732-2
  - DISA-STIG-needed_rules
  - NIST-800-53-AC-3
  - PCI-DSSv4-8.3
  - PCI-DSSv4-8.3.4
  - configure_strategy
  - enable_authselect
  - low_complexity
  - medium_disruption
  - medium_severity
  - no_reboot_needed
  - stigforge_gapfill
- name: Enable authselect - Force authselect Profile Selection
  ansible.builtin.command:
    cmd: authselect select --force "{{ var_authselect_profile | default('sssd') }}"
  when:
  - result_authselect_current.rc != 0
  - result_authselect_select.rc != 0
  - result_altered_authselect.rc == 0
  tags:
  - CCE-89732-2
  - DISA-STIG-needed_rules
  - NIST-800-53-AC-3
  - PCI-DSSv4-8.3
  - PCI-DSSv4-8.3.4
  - configure_strategy
  - enable_authselect
  - low_complexity
  - medium_disruption
  - medium_severity
  - no_reboot_needed
  - stigforge_gapfill

# StigForge-owned gap-fill: install the `audit-rules` package on EL10 (same fix as rhel10_cis cis-l2-pre.yml).
# On EL10 (audit 4.0.x) auditctl, augenrules and audit-rules.service ship in the separate `audit-rules` subpackage; the StigReady
# base image has `audit` only. Without it the STIG audit rules are never loaded, every audit_rules_* OVAL check fails, and the
# role's own auditd check has no auditctl to call (stigready rhel-10:stig leg 9107338fb344, 2026-10-18: "auditctl: No such file or
# directory"; base image stigready-base-rhel10-v1.0.8 has audit-4.0.3-5.el10 and no /usr/sbin/auditctl).
- name: Install the audit-rules package (provides auditctl, augenrules and audit-rules.service on EL10)
  ansible.builtin.package:
    name: audit-rules
    state: present
  tags:
  - package_audit_installed
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed
  - stigforge_gapfill
